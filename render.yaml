services:
  - type: web
    name: kuozhan-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: JWT_SECRET
        value: kz_2026_abcdefg123456xyz789
      - key: SMTP_HOST
        value: smtp.qq.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: 3427451391@qq.com
      - key: SMTP_PASS
        value: REPLACE_WITH_QQ_AUTH_CODE
      - key: MAIL_FROM_NAME
        value: kuozhan
      - key: DB_PATH
        value: /var/data/app.db
